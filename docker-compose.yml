services:
  db:
    image: postgres:17
    env_file: .env
    # Come back by itself whenever Docker Desktop starts
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    # Mount code and tests so edits are picked up without rebuilding the image
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./alembic.ini:/app/alembic.ini
      - ./scripts:/app/scripts
      # Raw API recordings (ignored by git)
      - ./recordings:/app/recordings
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy

  # Queues the 6 a.m. daily run and the Sunday backfill, then runs them
  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "lotwatcher.worker"]
    restart: unless-stopped
    volumes:
      - ./src:/app/src
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
